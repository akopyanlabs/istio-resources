{{- range .Values.sidecars }}
---
apiVersion: networking.istio.io/v1alpha3
kind: Sidecar
metadata:
  name: {{ default $.Release.Name .name }}
  namespace: {{ default $.Release.Namespace $.Values.namespace }}
  labels:
    {{- include "istio-resources.labels" $ | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .workloadSelector }}
  workloadSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .outboundTrafficPolicy }}
  outboundTrafficPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
