{{- $ingress := .Values.ingress | default dict }}
{{- $vs := $ingress.virtualservice | default dict }}
{{- if $vs }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ default .Release.Name $ingress.name }}-virtualservice
  namespace: {{ default .Release.Namespace $.Values.namespace }}
  labels:
    {{- include "istio-resources.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hosts:
    {{- toYaml $ingress.hosts | nindent 4 }}
  gateways:
{{- if $ingress.gateways }}
  {{- range $ingress.gateways }}
    {{- $gwName := printf "%s-gateway-%s" (default $.Release.Name $ingress.name) .type }}
    {{- if $ingress.gatewayNamespace }}
    - {{ $ingress.gatewayNamespace }}/{{ $gwName }}
    {{- else }}
    - {{ $gwName }}
    {{- end }}
  {{- end }}
{{- else if $vs.gateways }}
  {{- range $vs.gateways }}
    - {{ . }}
  {{- end }}
{{- end }}
{{- $healthEnabled := ($vs.health | default dict).enabled }}
{{- if or $healthEnabled $vs.http }}
  http:
    {{- if $healthEnabled }}
    - match:
        - uri:
            prefix: /health
      rewrite:
        uri: /healthz/ready
      route:
        - destination:
            host: {{ default "istio-ingress-gateway" $vs.health.host }}
            port:
              number: {{ default 15021 $vs.health.port }}
    {{- end }}
    {{- range $vs.http }}
    {{- if .match }}
    - match:
        {{- toYaml .match | nindent 8 }}
    {{- else }}
    - match:
        - uri:
            prefix: /
    {{- end }}
    {{- with .rewrite }}
      rewrite:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .redirect }}
      redirect:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      route:
        {{- toYaml .route | nindent 8 }}
    {{- with .timeout }}
      timeout: {{ . }}
    {{- end }}
    {{- with .retries }}
      retries:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .headers }}
      headers:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .corsPolicy }}
      corsPolicy:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- end }}
{{- end }}
{{- with $vs.tcp }}
  tcp:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
