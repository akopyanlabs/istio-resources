{{- range .Values.requestAuthentication }}
---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: {{ default $.Release.Name .name }}
  namespace: {{ default $.Release.Namespace $.Values.namespace }}
  labels:
    {{- include "istio-resources.labels" $ | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .selector }}
  selector:
    {{- toYaml .selector | nindent 4 }}
  {{- end }}
  {{- if .targetRefs }}
  targetRefs:
    {{- toYaml .targetRefs | nindent 4 }}
  {{- end }}
  {{- if .jwtRules }}
  jwtRules:
    {{- toYaml .jwtRules | nindent 4 }}
  {{- end }}
{{- end }}
